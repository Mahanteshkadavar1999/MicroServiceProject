server:
  port: 8881

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8882
          predicates:
            - Path=/auth/**
          filters:
            - RemoveRequestHeader=Cookie

        - id: customer-service
          uri: http://localhost:8883
          predicates:
            - Path=/customer/**

        - id: loan-service
          uri: http://localhost:8884
          predicates:
            - Path=/loan/**

      default-filters:
        - AddResponseHeader=Gateway-Request, processed

  webflux:
    base-path: /

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    com.microservice: DEBUG
    reactor.netty: DEBUG

jwt:
  secret: aXW3Pz9FXa48kdfnFKE9393skfls93kdmSDF932jkLDs=
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway