server:
  port: 8882

spring:
  application:
    name: auth-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: auth-service
        health-check-path: /actuator/health
        health-check-interval: 10s

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: aXW3Pz9FXa48kdfnFKE9393skfls93kdmSDF932jkLDs=
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false  # Disable DB health check
