server:
  port: 8884

spring:
  application:
    name: loan-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true

  datasource:
    url: jdbc:mysql://localhost:3306/loan_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com:
      yourpackage: INFO

jwt:
  secret: aXW3Pz9FXa48kdfnFKE9393skfls93kdmSDF932jkLDs=
  expiration: 3600000

# Spring Boot Actuator Config
management:
  endpoints:
    web:
      # Expose all actuator endpoints over HTTP
      exposure:
        include: "*"
  endpoint:
    health:
      # Always show detailed health info, including subcomponents
      show-details: "always"
  health:
    # Enable health indicators for Resilience4j circuit breakers
    circuitbreakers:
      enabled: true

# Resilience4j Configuration
resilience4j:
  # Circuit Breaker Settings
  circuitbreaker:
    instances:
      customerService:  # Circuit breaker name (used in @CircuitBreaker annotation)
        # Enables Spring Boot Actuator health monitoring for this circuit breaker
        # Visible under /actuator/health
        registerHealthIndicator: true
        # Stores the last 10 circuit breaker events (success, failure, state change)
        # Useful for metrics and debugging
        event-consumer-buffer-size: 10
        # Uses a count-based sliding window (based on number of calls)
        # Alternative: TIME_BASED
        slidingWindowType: COUNT_BASED
        # Number of recent calls considered to calculate failure rate
        slidingWindowSize: 5
        # Circuit opens if 50% or more of calls in the window fail
        failureRateThreshold: 50
        # Time the circuit remains OPEN before moving to HALF_OPEN state
        waitDurationInOpenState: 5s
        # Number of trial calls allowed in HALF_OPEN state
        # Determines whether the circuit should close or reopen
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatically moves circuit from OPEN → HALF_OPEN after wait duration
        # If false, state transition must be triggered manually
        automaticTransitionFromOpenToHalfOpenEnabled: true
  # TimeLimiter Settings
  timelimiter:
    instances:
      customerService:
        # Maximum time allowed for a remote call to complete
        # If exceeded, a TimeoutException is thrown
        time-duration: 1s
        # Determines whether the running task should be cancelled after timeout
        # false → lets the task continue running in background
        # true  → interrupts and cancels the running task
        cancel-running-future: false
  # Retry Settings
  retry:
    instances:
      customerService:
        # Total number of attempts (initial call + retries)
        max-attempts: 3
        # Delay between retry attempts
        # Helps avoid immediate repeated failures
        wait-duration: 5s







