server:
  port: 8884

spring:
  application:
    name: loan-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true

  datasource:
    url: jdbc:mysql://localhost:3306/loan_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com:
      yourpackage: INFO

jwt:
  secret: aXW3Pz9FXa48kdfnFKE9393skfls93kdmSDF932jkLDs=
  expiration: 3600000

# =========================
# Spring Boot Actuator Config
# =========================
management:
  endpoints:
    web:
      # Expose all actuator endpoints over HTTP
      exposure:
        include: "*"
  endpoint:
    health:
      # Always show detailed health info, including subcomponents
      show-details: "always"
  health:
    # Enable health indicators for Resilience4j circuit breakers
    circuitbreakers:
      enabled: true

# =========================
# Resilience4j Circuit Breaker Config
# =========================
resilience4j:
  circuitbreaker:
    instances:
      loanCb: # Circuit breaker name (can be any service or call)
        # Register health indicator in Spring Boot Actuator
        registerHealthIndicator: true
        # Number of events to store in the buffer
        event-consumer-buffer-size: 10
        # Use count-based sliding window for failure rate calculation
        slidingWindowType: COUNT_BASED
        # Number of calls to consider in the sliding window
        slidingWindowSize: 5
        # Percentage of failed calls before opening the circuit
        failureRateThreshold: 50
        # How long the circuit stays open before attempting half-open
        waitDurationInOpenState: 5s
        # Number of calls allowed when circuit is half-open
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatically transition from open to half-open after waitDurationInOpenState
        automaticTransitionFromOpenToHalfOpenEnabled: true


