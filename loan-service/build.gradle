plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.microservice'
version = '0.0.1-SNAPSHOT'
description = 'Loan Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


ext {
    set('springCloudVersion', "2023.0.3")   // or latest available in 2023.0.x
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


dependencies {
    // Spring Web for building REST APIs
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Security for authentication and authorization (used in Auth Service)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // WebClient for reactive HTTP calls to other microservices
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Spring Cloud Consul for service discovery
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    // Spring Cloud LoadBalancer for client-side load balancing between services
    implementation "org.springframework.cloud:spring-cloud-starter-loadbalancer"

    // Resilience4j Circuit Breaker for fault tolerance, retries, and rate limiting
    implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j"

    // Spring Boot Actuator to monitor and manage your application via health and metrics endpoints
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Data JPA for database access using JPA/Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validation API for request payload validation (e.g., @Valid)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Logging support (SLF4J + Logback)
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    // JWT API for creating and parsing JWT tokens
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    // JWT implementation runtime dependency
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    // JWT Jackson support for JSON serialization/deserialization
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // MySQL database connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Spring Boot testing support (JUnit, Mockito, etc.)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

test {
    useJUnitPlatform()
}